<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <div class="input-container">
            <input type="text" id="todo-input" placeholder="Add New Task...">
            <input type="date" id="due-date">  
            <button id="add-task-btn">Add Task</button>
        </div>
        <ul id="todo-list"></ul>
        
        <div id="filter-buttons"> 
            <button data-filter="all" class="filter-btn active">All</button>
            <button data-filter="active" class="filter-btn">Active</button>
            <button data-filter="completed" class="filter-btn">Completed</button>
        </div>
        <div id="clear-btn-container">
            <button id="clear-completed-btn">Clear Completed</button>
        </div>


    </div>
    <script src="script.js"></script>
</body>
</html>
